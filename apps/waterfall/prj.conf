# The Wi-Fi driver brings the radio up at boot; nothing may scan or connect.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_ESP32_WIFI_STA_POWER_SAVE_NONE=y

# Burst capture at the native rates only: no ring, no PSRAM.
CONFIG_ESP_SDR=y
CONFIG_ESP_SDR_RX_DECIM=n

CONFIG_LOG=y
# uart_fifo_fill() for the binary frames to the host (64 bytes per USB packet).
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CRC=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_MAIN_STACK_SIZE=4096

# The ST7789V and the TCA8418 keyboard (shield m5stack_cardputer_adv).
CONFIG_DISPLAY=y
CONFIG_I2C=y

# The BMI270 accelerometer: holding the Cardputer upright switches to the portrait layout.
CONFIG_SENSOR=y
